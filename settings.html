<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YüzeTube ayarları</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body>
    <main>
      <header><img src="icons/icon.svg" alt=""><div><p>YOUTUBE ARAÇLARI</p><h1>YüzeTube ayarları</h1></div></header>
      <section class="intro"><strong>Ayarlar</strong><span>Değişiklikler otomatik kaydedilir.</span></section>
      <section class="card">
        <div class="group-title">Temel</div>
        <label><span><b>YüzeTube'u etkinleştir</b><small>Tüm görsel iyileştirmeleri açar</small></span><input type="checkbox" data-setting="enabled"></label>
        <label><span><b>Shorts'u gizle</b><small>Akıştaki Shorts raflarını ve kısayollarını kaldırır</small></span><input type="checkbox" data-setting="hideShorts"></label>
        <label><span><b>Reklam ve promosyonları gizle</b><small>Promosyon kartlarını arayüzden kaldırır</small></span><input type="checkbox" data-setting="hidePromotions"></label>
        <label><span><b>Sinema görünümü</b><small>Video sayfasında oynatıcıyı genişletir</small></span><input type="checkbox" data-setting="theaterMode"></label>
        <label><span><b>Ambiyans ışığını kapat</b><small>Oynatıcı çevresindeki renk efektini kapatır</small></span><input type="checkbox" data-setting="disableAmbient"></label>
        <label><span><b>Otomatik oynatmayı kapat</b><small>Video bitince sonraki video kendiliğinden başlamaz</small></span><input type="checkbox" data-setting="disableAutoplay"></label>
        <label><span><b>Videoları sessiz başlat</b><small>Yeni videolar sessiz açılır</small></span><input type="checkbox" data-setting="muteByDefault"></label>
        <label><span><b>Videoları tekrarla</b><small>Video bitince başa döner</small></span><input type="checkbox" data-setting="loopVideos"></label>
        <div class="group-title">Dikkat dağıtıcılar</div>
        <label><span><b>Video sonu kartlarını gizle</b><small>Son ekran ve bilgi kartlarını kaldırır</small></span><input type="checkbox" data-setting="hideEndCards"></label>
        <label><span><b>Canlı sohbeti gizle</b><small>Yayın ve premiyerlerde sohbet panelini kaldırır</small></span><input type="checkbox" data-setting="hideLiveChat"></label>
        <label><span><b>Keşif çiplerini gizle</b><small>Ana sayfadaki kategori çubuklarını kaldırır</small></span><input type="checkbox" data-setting="hideChips"></label>
        <div class="group-title">Görünüm</div>
        <label><span><b>Yuvarlak kartlar</b><small>Küçük resimlere ve video kartlarına yumuşak köşeler ekler</small></span><input type="checkbox" data-setting="roundedCorners"></label>
        <label><span><b>Sıkı ana sayfa ızgarası</b><small>Geniş ekranlarda satır başına daha fazla video gösterir</small></span><input type="checkbox" data-setting="compactGrid"></label>
        <label><span><b>Yorumları gizle</b><small>Video sayfasını izlemeye odaklı hale getirir</small></span><input type="checkbox" data-setting="hideComments"></label>
        <label><span><b>Hareketleri azalt</b><small>Geçiş ve hover animasyonlarını azaltır</small></span><input type="checkbox" data-setting="reduceMotion"></label>
        <label><span><b>Kompakt kenar çubuğu</b><small>Sol gezinme alanını daha sıkı hale getirir</small></span><input type="checkbox" data-setting="compactSidebar"></label>
        <label><span><b>Öneri panelini gizle</b><small>Video sayfasında sağdaki önerileri gizler</small></span><input type="checkbox" data-setting="hideRelated"></label>
        <label><span><b>Okunaklı başlıklar</b><small>Video başlıklarını daha net ve rahat okunur yapar</small></span><input type="checkbox" data-setting="readableTitles"></label>
        <label><span><b>Modern buton efektleri</b><small>Hover durumlarına yumuşak ve hafif geçişler ekler</small></span><input type="checkbox" data-setting="styledControls"></label>
        <label><span><b>Kontrolleri her zaman göster</b><small>Oynatma çubuğu ve düğmeleri sürekli görünür kalır</small></span><input type="checkbox" data-setting="alwaysShowControls"></label>
        <div class="group-title">Gelişmiş filtreler</div>
        <label><span><b>Ekstra rafları gizle</b><small>Ana sayfadaki Shorts, Trending gibi ek sıraları kaldırır</small></span><input type="checkbox" data-setting="hideExtraRows"></label>
        <label><span><b>Video sonu önerilerini gizle</b><small>Video bitince çıkan öneri duvarını kaldırır</small></span><input type="checkbox" data-setting="hideEndOfVideo"></label>
        <label><span><b>Oynanabilir kartları gizle</b><small>Playables oyun kartlarını akıştan kaldırır</small></span><input type="checkbox" data-setting="hidePlayables"></label>
        <label><span><b>Keşfet bağlantısını gizle</b><small>Soldaki Keşfet / Trending girişini kaldırır</small></span><input type="checkbox" data-setting="hideExploreLink"></label>
        <label><span><b>Sonraki video düğmesini gizle</b><small>Oynatıcıdaki sonraki video düğmesini kaldırır</small></span><input type="checkbox" data-setting="hideNextButton"></label>
        <label><span><b>Oynatıcıyı ortala</b><small>Sağdaki öneri panelini kaldırıp videoyu ortalar</small></span><input type="checkbox" data-setting="centerPlayer"></label>
        <label><span><b>Abonelik Shorts'larını gizle</b><small>Abonelik sayfasındaki Shorts videolarını kaldırır</small></span><input type="checkbox" data-setting="hideSubShorts"></label>
        <label><span><b>Çalma listesi önerilerini gizle</b><small>Video sayfasındaki çalma listesi önerilerini kaldırır</small></span><input type="checkbox" data-setting="hidePlaylistSuggestions"></label>
        <label><span><b>Kelime filtresi</b><small>Başlığı bu kelimelerle eşleşen videoları gizler (* joker)</small></span><input class="keyword" type="text" data-setting="blockedKeywords" placeholder="örn. sponsor, kedi*, reklam"></label>
      </section>
      <section class="card preferences">
        <div class="group-title">Oynatıcı</div>
        <label><span><b>Varsayılan oynatma hızı</b><small>Yeni videolar bu hızla başlar</small></span><select data-setting="playbackRate"><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2x</option></select></label>
        <label><span><b>Varsayılan ses seviyesi</b><small>Oynatıcı açıldığında kullanılacak seviye</small></span><input class="range" type="range" min="0" max="100" step="5" data-setting="defaultVolume"></label>
        <label><span><b>Renk teması</b><small>YouTube arayüzüne hafif bir renk karakteri verir</small></span><select data-setting="theme"><option value="default">Varsayılan</option><option value="midnight">Midnight</option><option value="rose">Rose</option><option value="ocean">Ocean</option></select></label>
      </section>
      <p class="safe">🔒 Gizlilik öncelikli: cookie, geçmiş veya hesap verilerine erişilmez.</p>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
