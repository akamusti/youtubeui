<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YüzeTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="hero" id="statusCard">
        <div class="hero-top">
          <div class="brand">
            <span class="brand-mark"><img src="icons/icon.svg" alt=""></span>
            <div>
              <h1>YüzeTube</h1>
              <small id="statusText">YouTube'da etkin</small>
            </div>
          </div>
          <label class="power" title="YüzeTube'u aç / kapat" aria-label="YüzeTube'u etkinleştir">
            <input id="enabled" type="checkbox">
            <span class="power-ring">⏻</span>
          </label>
        </div>
        <div class="meter">
          <div class="meter-bar"><span id="meterFill"></span></div>
          <span class="meter-text"><b id="activeCount">0</b> / <span id="totalCount">8</span> hızlı ayar açık</span>
        </div>
      </header>

      <h2 class="label">Hızlı ayarlar</h2>
      <section class="tiles" aria-label="Hızlı ayarlar">
        <label class="tile" data-quick style="--hue: 262">
          <input type="checkbox" data-setting="hideShorts">
          <span class="tile-icon">◈</span>
          <b>Shorts'u gizle</b>
        </label>
        <label class="tile" data-quick style="--hue: 36">
          <input type="checkbox" data-setting="hidePromotions">
          <span class="tile-icon">✦</span>
          <b>Promosyonlar</b>
        </label>
        <label class="tile" data-quick style="--hue: 330">
          <input type="checkbox" data-setting="theaterMode">
          <span class="tile-icon">▣</span>
          <b>Sinema modu</b>
        </label>
        <label class="tile" data-quick style="--hue: 205">
          <input type="checkbox" data-setting="disableAmbient">
          <span class="tile-icon">◌</span>
          <b>Ambiyans kapalı</b>
        </label>
        <label class="tile" data-quick style="--hue: 352">
          <input type="checkbox" data-setting="compactSidebar">
          <span class="tile-icon">▥</span>
          <b>Kompakt menü</b>
        </label>
        <label class="tile" data-quick style="--hue: 20">
          <input type="checkbox" data-setting="disableAutoplay">
          <span class="tile-icon">⏭</span>
          <b>Autoplay kapalı</b>
        </label>
        <label class="tile" data-quick style="--hue: 158">
          <input type="checkbox" data-setting="muteByDefault">
          <span class="tile-icon">⊘</span>
          <b>Sessiz başlat</b>
        </label>
        <label class="tile" data-quick style="--hue: 280">
          <input type="checkbox" data-setting="loopVideos">
          <span class="tile-icon">↻</span>
          <b>Videoyu tekrarla</b>
        </label>
      </section>

      <h2 class="label">Oynatma</h2>
      <section class="card">
        <div class="row">
          <span class="row-title">Hız</span>
          <div class="segmented" id="rateGroup" role="radiogroup" aria-label="Varsayılan oynatma hızı">
            <button type="button" data-rate="1">1×</button>
            <button type="button" data-rate="1.25">1.25</button>
            <button type="button" data-rate="1.5">1.5</button>
            <button type="button" data-rate="1.75">1.75</button>
            <button type="button" data-rate="2">2×</button>
          </div>
        </div>
        <div class="row">
          <span class="row-title">Ses</span>
          <input id="volume" type="range" min="0" max="100" step="5" data-setting="defaultVolume">
          <output id="volumeOut">80%</output>
        </div>
      </section>

      <p id="notYoutube" class="notice" hidden>Ayarlar bir YouTube sekmesinde anında uygulanır.</p>

      <button id="advancedButton" class="all-btn" type="button">
        <span>Tüm ayarlar</span>
        <small>tema, filtreler, anahtar kelimeler</small>
        <span class="chev">→</span>
      </button>

      <footer><i class="dot"></i> Yerel çalışır · veri toplamaz</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
