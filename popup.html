<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YüzeTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon.svg" alt="">
          <div>
            <h1>YüzeTube</h1>
            <span>youtube için küçük dokunuşlar</span>
          </div>
        </div>
        <button id="optionsButton" class="icon-button" type="button" aria-label="Tüm ayarları aç">⚙</button>
      </header>

      <section class="status-card">
        <span class="status-dot"></span>
        <div class="status-copy">
          <strong id="statusTitle">YüzeTube aktif</strong>
          <span id="statusText">Ayarların YouTube'da uygulanıyor</span>
        </div>
        <label class="switch" aria-label="YüzeTube'u etkinleştir">
          <input id="enabled" type="checkbox">
          <span class="slider"></span>
        </label>
      </section>

      <div class="section-heading">
        <span>Hızlı ayarlar</span>
        <span class="count">7 seçenek</span>
      </div>
      <section class="settings" aria-label="Hızlı ayarlar">
        <label class="setting">
          <span class="setting-icon shorts">◈</span>
          <span class="setting-copy"><strong>Shorts'u gizle</strong><small>Akışta Shorts görünmesin</small></span>
          <input type="checkbox" data-setting="hideShorts" class="check">
        </label>
        <label class="setting">
          <span class="setting-icon promos">✦</span>
          <span class="setting-copy"><strong>Promosyonları gizle</strong><small>İçerik dışı kartları kaldır</small></span>
          <input type="checkbox" data-setting="hidePromotions" class="check">
        </label>
        <label class="setting">
          <span class="setting-icon theater">▣</span>
          <span class="setting-copy"><strong>Sinema görünümü</strong><small>Video alanını genişlet</small></span>
          <input type="checkbox" data-setting="theaterMode" class="check">
        </label>
        <label class="setting">
          <span class="setting-icon ambient">◌</span>
          <span class="setting-copy"><strong>Ambiyans ışığını kapat</strong><small>Oynatıcı çevresini sadeleştir</small></span>
          <input type="checkbox" data-setting="disableAmbient" class="check">
        </label>
        <label class="setting">
          <span class="setting-icon autoplay">⏭</span>
          <span class="setting-copy"><strong>Otomatik oynatmayı kapat</strong><small>Sıradaki video başlamasın</small></span>
          <input type="checkbox" data-setting="disableAutoplay" class="check">
        </label>
        <label class="setting">
          <span class="setting-icon mute">⊘</span>
          <span class="setting-copy"><strong>Sessiz başlat</strong><small>Videolar sessiz açılsın</small></span>
          <input type="checkbox" data-setting="muteByDefault" class="check">
        </label>
        <label class="setting">
          <span class="setting-icon loop">↻</span>
          <span class="setting-copy"><strong>Videoyu tekrarla</strong><small>Bitince başa dönsün</small></span>
          <input type="checkbox" data-setting="loopVideos" class="check">
        </label>
      </section>

      <button id="advancedButton" class="advanced-button" type="button">
        <span class="advanced-icon">☷</span>
        <span><strong>Tüm ayarlar</strong><small>Tema, oynatıcı ve görünüm seçenekleri</small></span>
        <span class="arrow">›</span>
      </button>

      <footer>
        <span><i class="privacy-dot"></i> Yerel ve gizli</span>
        <span class="footer-divider">·</span>
        <span>Cookie erişimi yok</span>
      </footer>
      <p id="notYoutube" class="notice" hidden>YouTube sekmesi açık olduğunda ayarlar anında uygulanır.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
